name: Keep Aiven Database & Website Alive 24/7

on:
  schedule:
    # Run every 5 minutes (up to 288 times a day) for continuous 24/7 keep-alive
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keep_alive:
    name: Keep Aiven Database & Endpoints Active
    runs-on: ubuntu-latest
    steps:
      - name: Verify & Ensure Aiven Cloud Service State
        env:
          AIVEN_API_TOKEN: ${{ secrets.AIVEN_API_TOKEN }}
          AIVEN_PROJECT: ${{ secrets.AIVEN_PROJECT }}
          AIVEN_SERVICE: ${{ secrets.AIVEN_SERVICE }}
        run: |
          echo "========================================================"
          echo "🔍 Step 1: Checking Aiven Cloud Infrastructure Status..."
          echo "========================================================"

          if [ -n "$AIVEN_API_TOKEN" ] && [ -n "$AIVEN_PROJECT" ] && [ -n "$AIVEN_SERVICE" ]; then
            AIVEN_STATUS=$(curl -s -H "Authorization: aivenv1 ${AIVEN_API_TOKEN}" "https://api.aiven.io/v1/project/${AIVEN_PROJECT}/service/${AIVEN_SERVICE}" || echo "{}")
            STATE=$(echo "$AIVEN_STATUS" | jq -r '.service.state // empty' | tr '[:lower:]' '[:upper:]')
            echo "Aiven Cloud Service '${AIVEN_SERVICE}' State: $STATE"

            if [ "$STATE" = "RUNNING" ]; then
              echo "✅ Aiven Cloud Service is RUNNING smoothly in the cloud."
            else
              echo "⚠️ Aiven service is currently '$STATE'! Forcing power-on now..."
              POWER_RES=$(curl -s -X PUT "https://api.aiven.io/v1/project/${AIVEN_PROJECT}/service/${AIVEN_SERVICE}" \
                -H "Authorization: aivenv1 ${AIVEN_API_TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{"powered": true}')
              echo "Power-on dispatch result: $POWER_RES"
              echo "⏳ Waiting 15 seconds for cloud resources to spin up..."
              sleep 15
            fi
          else
            echo "ℹ️ Aiven API secrets not configured. Proceeding directly to database query."
          fi

      - name: Direct Native PostgreSQL Connection (if DB Password Configured)
        env:
          AIVEN_DB_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}
          AIVEN_PROJECT: ${{ secrets.AIVEN_PROJECT }}
          AIVEN_SERVICE: ${{ secrets.AIVEN_SERVICE }}
        run: |
          if [ -n "$AIVEN_DB_PASSWORD" ]; then
            echo "========================================================"
            echo "⚡ Step 2: Direct Native PostgreSQL TCP Connection..."
            echo "========================================================"
            
            DB_HOST="pg-c937fcb-awand795-fbb1.h.aivencloud.com"
            DB_PORT="25789"
            DB_USER="avnadmin"
            DB_NAME="defaultdb"

            if ! command -v psql &> /dev/null; then
              sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
            fi

            PGPASSWORD="$AIVEN_DB_PASSWORD" psql "host=$DB_HOST port=$DB_PORT user=$DB_USER dbname=$DB_NAME sslmode=require" -c "SELECT NOW() as direct_keep_alive_time, COUNT(*) as total_posts FROM posts;"
            if [ $? -eq 0 ]; then
              echo "✅ DIRECT NATIVE POSTGRESQL PING SUCCESSFUL!"
            else
              echo "⚠️ Direct native psql returned non-zero exit code, proceeding to API check."
            fi
          fi

      - name: Ping Aiven Database via Netlify Functions
        env:
          AIVEN_API_TOKEN: ${{ secrets.AIVEN_API_TOKEN }}
          AIVEN_PROJECT: ${{ secrets.AIVEN_PROJECT }}
          AIVEN_SERVICE: ${{ secrets.AIVEN_SERVICE }}
        run: |
          echo "========================================================"
          echo "🚀 Step 3: Pinging Awanda Blog API (Forces Aiven DB Query)..."
          echo "========================================================"

          TMP_RES=$(mktemp)
          HTTP_CODE=$(curl -s -L --retry 3 --retry-delay 2 --max-time 20 -w "%{http_code}" -o "$TMP_RES" https://awanda.web.id/api/posts || curl -s -L --retry 2 -w "%{http_code}" -o "$TMP_RES" https://awanda.eu.org/api/posts || echo "000")

          echo "Database API Status: HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Aiven PostgreSQL is ACTIVE, RESPONSIVE, and ALIVE!"
          else
            echo "❌ CRITICAL: Database query failed with HTTP $HTTP_CODE!"
            echo "Response snippet:"
            head -n 10 "$TMP_RES" || true
            echo ""

            # If Aiven API secrets are configured, attempt auto-recovery power-on
            if [ -n "$AIVEN_API_TOKEN" ] && [ -n "$AIVEN_PROJECT" ] && [ -n "$AIVEN_SERVICE" ]; then
              echo "🔄 Attempting automatic power-on healing via Aiven REST API..."
              AIVEN_HEAL_RES=$(curl -s -X PUT "https://api.aiven.io/v1/project/${AIVEN_PROJECT}/service/${AIVEN_SERVICE}" \
                -H "Authorization: aivenv1 ${AIVEN_API_TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{"powered": true}')
              echo "Aiven API Response: $AIVEN_HEAL_RES"
              echo "⏳ Waiting 20 seconds for PostgreSQL to accept connections..."
              sleep 20

              echo "🔄 Re-testing database query after auto-recovery..."
              RETRY_CODE=$(curl -s -L --max-time 15 -w "%{http_code}" -o "$TMP_RES" https://awanda.web.id/api/posts || echo "000")
              echo "Re-test HTTP Status: $RETRY_CODE"

              if [ "$RETRY_CODE" -eq 200 ]; then
                echo "🎉 Auto-recovery SUCCESSFUL! Aiven PostgreSQL is now back online!"
                rm -f "$TMP_RES"
                exit 0
              fi
            fi

            rm -f "$TMP_RES"
            echo "💥 FATAL: Aiven PostgreSQL is DOWN and unreachable! Failing workflow to alert maintainer."
            exit 1
          fi
          rm -f "$TMP_RES"

      - name: Ping Blog & Homepage Endpoints
        run: |
          echo "Pinging Homepage & Blog Pages..."
          curl -s -o /dev/null -w "Web.id Homepage Status: %{http_code}\n" https://awanda.web.id/ || true
          curl -s -o /dev/null -w "Web.id Blog Status: %{http_code}\n" https://awanda.web.id/blog || true
          curl -s -o /dev/null -w "Web.id Sitemap Status: %{http_code}\n" https://awanda.web.id/sitemap.xml || true
          curl -s -o /dev/null -w "EU.org Homepage Status: %{http_code}\n" https://awanda.eu.org/ || true
          echo "🎉 All endpoints refreshed and keep-alive signal sent successfully!"
