name: Keep Alive & Periodic Sitemap Ping
on:
  schedule:
    # Run every 2 days at midnight UTC
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Website & Blog Endpoints
        run: |
          echo "Pinging Awanda Portfolio & Blog..."
          curl -s -o /dev/null -w "%{http_code}\n" https://awanda.web.id/
          curl -s -o /dev/null -w "%{http_code}\n" https://awanda.web.id/blog
          curl -s -o /dev/null -w "%{http_code}\n" https://awanda.web.id/api/posts
          echo "Ping completed successfully!"
